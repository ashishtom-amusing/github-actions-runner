# Per-model overrides. Copy this file for each new model; the chart is shared.
# image, modelVersion, role and ingress.hostSuffix are set by the workflow.
replicaCount: 1

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { cpu: 500m, memory: 768Mi }

serviceMonitor:
  enabled: true
  interval: 30s

predictionLog:
  enabled: true
  bucket: predictions
