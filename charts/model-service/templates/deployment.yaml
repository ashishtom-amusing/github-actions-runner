apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "model-service.name" . }}
  labels: {{- include "model-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "model-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "model-service.labels" . | nindent 8 }}
      annotations:
        # Forces a rollout when the model version changes even if the tag repeats
        mlops/model-version: {{ .Values.modelVersion | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MODEL_NAME
              value: {{ include "model-service.name" . | quote }}
            - name: MODEL_VERSION
              value: {{ .Values.modelVersion | quote }}
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 24        # up to 2 min to load the model
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
