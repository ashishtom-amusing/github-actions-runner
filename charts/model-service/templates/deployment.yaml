{{- if ne (include "model-service.useRollout" .) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "model-service.fullname" . }}
  labels: {{- include "model-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "model-service.selectorLabels" . | nindent 6 }}
  template: {{- include "model-service.podTemplate" . | nindent 4 }}
{{- end }}
