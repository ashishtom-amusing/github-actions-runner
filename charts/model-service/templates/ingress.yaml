{{- if .Values.ingress.enabled }}
{{- $full := include "model-service.fullname" . }}
{{- if ne (include "model-service.useRollout" .) "true" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}
  labels: {{- include "model-service.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ $full }}.{{ include "model-service.host" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}
                port:
                  number: {{ .Values.service.port }}
{{- else }}
# Canary mode: users reach the champion through this weighted service.
# Argo Rollouts changes the two weights during a canary; do not edit them.
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: {{ $full }}
  labels: {{- include "model-service.labels" . | nindent 4 }}
spec:
  weighted:
    services:
      - name: {{ $full }}
        port: {{ .Values.service.port }}
        weight: 100
      - name: {{ $full }}-canary
        port: {{ .Values.service.port }}
        weight: 0
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $full }}
  labels: {{- include "model-service.labels" . | nindent 4 }}
spec:
  entryPoints: [web]
  routes:
    - match: Host(`{{ $full }}.{{ include "model-service.host" . }}`)
      kind: Rule
      services:
        - name: {{ $full }}
          kind: TraefikService
    # Preview: only the new version, for the smoke test before any user sees it.
    - match: Host(`{{ $full }}-canary.{{ include "model-service.host" . }}`)
      kind: Rule
      services:
        - name: {{ $full }}-canary
          port: {{ .Values.service.port }}
{{- end }}
{{- end }}
